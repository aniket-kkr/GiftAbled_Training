<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal | CRUD</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 3rem;
        }

        header {
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            color: white;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #c7d2fe;
            font-size: 1rem;
        }

        .container {
            max-width: 1100px;
            margin: -1.5rem auto 0 auto;
            padding: 0 1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: #ede9fe;
            color: var(--primary);
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Controls */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-edit {
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-edit:hover {
            background: #c7d2fe;
        }

        .btn-delete {
            background: #fee2e2;
            color: var(--danger);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #fca5a5;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: #f8fafc;
            padding: 0.85rem 1rem;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .badge-course {
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .status-pass {
            background: #dcfce7;
            color: #15803d;
        }

        .status-fail {
            background: #fee2e2;
            color: #b91c1c;
        }

        .progress-bar-bg {
            background: #e2e8f0;
            height: 6px;
            border-radius: 9999px;
            overflow: hidden;
            width: 90px;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 9999px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 1.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-cancel:hover {
            background: #cbd5e1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 200;
            font-size: 0.95rem;
        }

        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Student Management System</h1>
            <p class="subtitle">Assignment 14 &bull; Full CRUD Web Application with FastAPI Backend</p>
        </div>
    </header>

    <div class="container">
        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎓</div>
                <div>
                    <div class="stat-val" id="statTotal">0</div>
                    <div class="stat-lbl">Total Students</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div>
                    <div class="stat-val" id="statAvg">0%</div>
                    <div class="stat-lbl">Class Average</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div>
                    <div class="stat-val" id="statPassed">0</div>
                    <div class="stat-lbl">Passed Students</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div>
                    <div class="stat-val" id="statTop" style="font-size: 1.1rem; line-height: 1.4;">-</div>
                    <div class="stat-lbl">Top Scorer</div>
                </div>
            </div>
        </div>

        <!-- Controls & Table -->
        <div class="card">
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, email, or course..." oninput="handleSearch()">
                </div>
                <button class="btn" onclick="openAddModal()">
                    <span>➕</span> Add New Student
                </button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Marks</th>
                            <th>Status</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Student</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="studentForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="studentName">Full Name *</label>
                    <input type="text" id="studentName" required placeholder="e.g. Aniket Kumar">
                </div>
                <div class="form-group">
                    <label for="studentEmail">Email Address *</label>
                    <input type="email" id="studentEmail" required placeholder="e.g. aniket@example.com">
                </div>
                <div class="form-group">
                    <label for="studentCourse">Course *</label>
                    <input type="text" id="studentCourse" required placeholder="e.g. Python Fullstack">
                </div>
                <div class="form-group">
                    <label for="studentMarks">Marks (0 - 100) *</label>
                    <input type="number" id="studentMarks" required min="0" max="100" step="0.5" placeholder="e.g. 88.5">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn" id="submitBtn">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let allStudents = [];

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('statTotal').textContent = data.total;
                document.getElementById('statAvg').textContent = data.avg + '%';
                document.getElementById('statPassed').textContent = data.pass_count;
                document.getElementById('statTop').textContent = data.top_student;
            } catch (err) {
                console.error("Failed to load stats", err);
            }
        }

        async function loadStudents(search = '') {
            try {
                const url = search ? `/api/students?search=${encodeURIComponent(search)}` : '/api/students';
                const res = await fetch(url);
                allStudents = await res.json();
                renderTable(allStudents);
                fetchStats();
            } catch (err) {
                showToast("Failed to fetch students from server", "error");
            }
        }

        function renderTable(students) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #94a3b8;">No student records found.</td></tr>`;
                return;
            }

            students.forEach(s => {
                const isPass = s.marks >= 50.0;
                const statusBadge = isPass 
                    ? `<span class="status-badge status-pass">Pass</span>`
                    : `<span class="status-badge status-fail">Fail</span>`;
                const fillColor = isPass ? '#10b981' : '#ef4444';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${s.id}</strong></td>
                    <td><strong>${escapeHtml(s.name)}</strong></td>
                    <td>${escapeHtml(s.email)}</td>
                    <td><span class="badge-course">${escapeHtml(s.course)}</span></td>
                    <td>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${s.marks}%; background: ${fillColor};"></div>
                        </div>
                        <strong>${s.marks}%</strong>
                    </td>
                    <td>${statusBadge}</td>
                    <td style="text-align: right;">
                        <button class="btn-edit" onclick="openEditModal(${s.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteStudent(${s.id}, '${escapeHtml(s.name)}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            loadStudents(query);
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = "Add New Student";
            document.getElementById('studentId').value = "";
            document.getElementById('studentForm').reset();
            document.getElementById('studentModal').classList.add('active');
        }

        function openEditModal(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;

            document.getElementById('modalTitle').textContent = "Edit Student";
            document.getElementById('studentId').value = student.id;
            document.getElementById('studentName').value = student.name;
            document.getElementById('studentEmail').value = student.email;
            document.getElementById('studentCourse').value = student.course;
            document.getElementById('studentMarks').value = student.marks;

            document.getElementById('studentModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('studentModal').classList.remove('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const payload = {
                name: document.getElementById('studentName').value,
                email: document.getElementById('studentEmail').value,
                course: document.getElementById('studentCourse').value,
                marks: parseFloat(document.getElementById('studentMarks').value)
            };

            try {
                if (id) {
                    // Update
                    const res = await fetch(`/api/students/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error("Failed to update");
                    showToast("Student updated successfully", "success");
                } else {
                    // Create
                    const res = await fetch('/api/students', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error("Failed to create");
                    showToast("Student created successfully", "success");
                }
                closeModal();
                loadStudents(document.getElementById('searchInput').value);
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        async function deleteStudent(id, name) {
            if (!confirm(`Are you sure you want to delete student "${name}"?`)) return;

            try {
                const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Failed to delete");
                showToast(`Student "${name}" deleted successfully`, "success");
                loadStudents(document.getElementById('searchInput').value);
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize on load
        loadStudents();
    </script>
</body>
</html>
