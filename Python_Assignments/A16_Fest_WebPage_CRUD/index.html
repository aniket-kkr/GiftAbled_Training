<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Fest Event Portal | CRUD</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #faf5ff;
            --card-bg: #ffffff;
            --text-main: #1e1b4b;
            --text-muted: #6b7280;
            --border: #f3e8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 4rem;
        }

        header {
            background: linear-gradient(135deg, #7c3aed 0%, #4338ca 50%, #db2777 100%);
            color: white;
            padding: 3rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .badge-fest {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 0.3rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #f3e8ff;
            font-size: 1.05rem;
        }

        .container {
            max-width: 1100px;
            margin: -1.75rem auto 0 auto;
            padding: 0 1rem;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.05);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: #ede9fe;
            color: var(--primary);
        }

        .stat-val {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Controls */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.06);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }

        .search-row {
            display: flex;
            gap: 0.75rem;
            flex: 1;
            min-width: 300px;
        }

        .search-row input, .search-row select {
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            border: 1px solid #d8b4fe;
            font-size: 0.95rem;
            outline: none;
            background: white;
        }

        .search-row input { flex: 2; }
        .search-row select { flex: 1; }

        .search-row input:focus, .search-row select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #9333ea 100%);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Table & Cards */
        .table-responsive {
            overflow-x: auto;
            margin-top: 1.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: #faf5ff;
            padding: 0.85rem 1rem;
            color: #6b21a8;
            font-weight: 700;
            border-bottom: 2px solid #f3e8ff;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fdfaff;
        }

        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cat-technical { background: #e0e7ff; color: #3730a3; }
        .cat-cultural { background: #fce7f3; color: #9d174d; }
        .cat-gaming { background: #ede9fe; color: #5b21b6; }
        .cat-workshop { background: #fef3c7; color: #92400e; }
        .cat-default { background: #f3f4f6; color: #374151; }

        .progress-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .progress-bar-bg {
            background: #e9d5ff;
            height: 7px;
            border-radius: 9999px;
            width: 80px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 9999px;
        }

        .btn-action {
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-reg { background: #dcfce7; color: #15803d; }
        .btn-reg:hover { background: #bbf7d0; }

        .btn-edit { background: #ede9fe; color: var(--primary); }
        .btn-edit:hover { background: #ddd6fe; }

        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn-delete:hover { background: #fca5a5; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 14px;
            width: 100%;
            max-width: 520px;
            padding: 1.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-header h3 { font-size: 1.25rem; color: var(--text-main); }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #d8b4fe;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-cancel { background: #e2e8f0; color: #475569; }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e1b4b;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 200;
            font-size: 0.95rem;
        }

        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <span class="badge-fest">FESTIVAL 2026</span>
            <h1>Campus Fest Event Portal</h1>
            <p class="subtitle">Assignment 16 &bull; Full CRUD Event Management System with Registration Engine</p>
        </div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎉</div>
                <div>
                    <div class="stat-val" id="statEvents">0</div>
                    <div class="stat-lbl">Active Events</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎟️</div>
                <div>
                    <div class="stat-val" id="statReg">0</div>
                    <div class="stat-lbl">Total Registrations</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏟️</div>
                <div>
                    <div class="stat-val" id="statCap">0</div>
                    <div class="stat-lbl">Seating Capacity</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏷️</div>
                <div>
                    <div class="stat-val" id="statCat">0</div>
                    <div class="stat-lbl">Categories</div>
                </div>
            </div>
        </div>

        <!-- Controls & Table -->
        <div class="card">
            <div class="controls">
                <div class="search-row">
                    <input type="text" id="searchInput" placeholder="Search event, coordinator, or venue..." oninput="handleSearch()">
                    <select id="categoryFilter" onchange="handleSearch()">
                        <option value="All">All Categories</option>
                    </select>
                </div>
                <button class="btn" onclick="openAddModal()">
                    <span>➕</span> Add Fest Event
                </button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Event Details</th>
                            <th>Category</th>
                            <th>Date & Time</th>
                            <th>Venue</th>
                            <th>Coordinator</th>
                            <th>Registration</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Fest Event</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="eventForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label for="eventTitle">Event Title *</label>
                    <input type="text" id="eventTitle" required placeholder="e.g. Code-A-Thon: 24Hr Hackathon">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventCategory">Category *</label>
                        <select id="eventCategory" required>
                            <option value="Technical">Technical</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="eventSeats">Total Seats *</label>
                        <input type="number" id="eventSeats" required min="1" max="10000" placeholder="e.g. 60">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date *</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time *</label>
                        <input type="text" id="eventTime" required placeholder="e.g. 10:00 AM">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventVenue">Venue *</label>
                        <input type="text" id="eventVenue" required placeholder="e.g. Turing Innovation Lab">
                    </div>
                    <div class="form-group">
                        <label for="eventCoordinator">Coordinator *</label>
                        <input type="text" id="eventCoordinator" required placeholder="e.g. Aniket Kumar">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let allEvents = [];

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('statEvents').textContent = data.total_events;
                document.getElementById('statReg').textContent = data.total_registrations;
                document.getElementById('statCap').textContent = data.total_capacity;
                document.getElementById('statCat').textContent = data.categories.length;

                const catSelect = document.getElementById('categoryFilter');
                const currentVal = catSelect.value;
                catSelect.innerHTML = `<option value="All">All Categories</option>`;
                data.categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    if (c === currentVal) opt.selected = true;
                    catSelect.appendChild(opt);
                });
            } catch (err) {
                console.error("Failed to fetch stats", err);
            }
        }

        async function loadEvents(search = '', category = 'All') {
            try {
                let url = '/api/events?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (category && category !== 'All') url += `category=${encodeURIComponent(category)}&`;

                const res = await fetch(url);
                allEvents = await res.json();
                renderTable(allEvents);
                fetchStats();
            } catch (err) {
                showToast("Failed to fetch fest events", "error");
            }
        }

        function getCategoryClass(cat) {
            const c = cat.toLowerCase();
            if (c.includes('tech')) return 'cat-technical';
            if (c.includes('cult')) return 'cat-cultural';
            if (c.includes('game') || c.includes('gaming')) return 'cat-gaming';
            if (c.includes('work')) return 'cat-workshop';
            return 'cat-default';
        }

        function renderTable(events) {
            const tbody = document.getElementById('eventsTableBody');
            tbody.innerHTML = '';

            if (events.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #94a3b8;">No fest events found.</td></tr>`;
                return;
            }

            events.forEach(e => {
                const isFull = e.registered_seats >= e.max_seats;
                const pct = Math.min(100, Math.round((e.registered_seats / e.max_seats) * 100));
                const barColor = isFull ? '#ef4444' : '#7c3aed';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(e.title)}</strong></td>
                    <td><span class="category-badge ${getCategoryClass(e.category)}">${escapeHtml(e.category)}</span></td>
                    <td>📅 ${escapeHtml(e.date)} <br><small style="color:var(--text-muted);">⏰ ${escapeHtml(e.time)}</small></td>
                    <td>📍 ${escapeHtml(e.venue)}</td>
                    <td>👤 ${escapeHtml(e.coordinator)}</td>
                    <td>
                        <div class="progress-box">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pct}%; background: ${barColor};"></div>
                            </div>
                            <small><strong>${e.registered_seats}/${e.max_seats}</strong> ${isFull ? '<span style="color:#ef4444;font-weight:700;">(Full)</span>' : ''}</small>
                        </div>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn-action btn-reg" onclick="registerForEvent(${e.id})" ${isFull ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>${isFull ? 'Booked' : 'Register'}</button>
                        <button class="btn-action btn-edit" onclick="openEditModal(${e.id})">Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteEvent(${e.id}, '${escapeHtml(e.title)}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleSearch() {
            const search = document.getElementById('searchInput').value;
            const cat = document.getElementById('categoryFilter').value;
            loadEvents(search, cat);
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = "Add Fest Event";
            document.getElementById('eventId').value = "";
            document.getElementById('eventForm').reset();
            document.getElementById('eventModal').classList.add('active');
        }

        function openEditModal(id) {
            const ev = allEvents.find(e => e.id === id);
            if (!ev) return;

            document.getElementById('modalTitle').textContent = "Edit Fest Event";
            document.getElementById('eventId').value = ev.id;
            document.getElementById('eventTitle').value = ev.title;
            document.getElementById('eventCategory').value = ev.category;
            document.getElementById('eventSeats').value = ev.max_seats;
            document.getElementById('eventDate').value = ev.date;
            document.getElementById('eventTime').value = ev.time;
            document.getElementById('eventVenue').value = ev.venue;
            document.getElementById('eventCoordinator').value = ev.coordinator;

            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const payload = {
                title: document.getElementById('eventTitle').value,
                category: document.getElementById('eventCategory').value,
                max_seats: parseInt(document.getElementById('eventSeats').value),
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                venue: document.getElementById('eventVenue').value,
                coordinator: document.getElementById('eventCoordinator').value
            };

            try {
                if (id) {
                    const res = await fetch(`/api/events/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const resData = await res.json();
                    if (!res.ok) throw new Error(resData.detail || "Failed to update event");
                    showToast("Event updated successfully", "success");
                } else {
                    const res = await fetch('/api/events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const resData = await res.json();
                    if (!res.ok) throw new Error(resData.detail || "Failed to create event");
                    showToast("Fest event created successfully", "success");
                }
                closeModal();
                handleSearch();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        async function registerForEvent(id) {
            try {
                const res = await fetch(`/api/events/${id}/register`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Registration failed");
                showToast(data.message, "success");
                handleSearch();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        async function deleteEvent(id, title) {
            if (!confirm(`Are you sure you want to cancel and delete event "${title}"?`)) return;

            try {
                const res = await fetch(`/api/events/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Failed to delete event");
                showToast(`Event "${title}" deleted successfully`, "success");
                handleSearch();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial Load
        loadEvents();
    </script>
</body>
</html>
